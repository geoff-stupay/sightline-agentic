<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sightline AgenticTrust v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Barlow:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: HUMAN deck system. Caption column left (the story is told in captions, sound off), visual area right:
   either the agent app + merchant browser + panel, or a full-width board. Thin scene timeline + small controls below. */
:root{
  color-scheme:light;
  --field:#F6F4FF; --card:#FFFFFF; --lav:#EAE4FB; --lav-2:#F6F4FF; --line:#E0E1EE; --line-2:#D4CFF0;
  --ink:#1A1A1A; --muted:#4A4A6A; --faint:#6B7280; --deep:#1C1C2E;
  --purple:#6C47FF; --purple-deep:#5728DE;
  --ok:#16A34A; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2;
  --f-display:"Bricolage Grotesque","Barlow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--field);color:var(--ink);font-family:var(--f-body);font-size:15px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.hmark,.hlogo,.agent-ic{display:inline-block;flex:none}
.hmark,.hlogo{color:var(--purple-deep)}

.app{min-height:100%;display:flex;flex-direction:column;gap:16px;max-width:1440px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 14px}
.top{display:flex;align-items:center;gap:12px}
.top .hlogo{height:20px;width:auto;aspect-ratio:480/111;color:var(--ink)}
.top .div{width:1px;height:18px;background:var(--line-2)}
.top small{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted)}

.stage{flex:1;display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:32px;align-items:center}
.cap{min-width:0}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 11px;margin-bottom:16px}
.tag.without{background:#ECEBF2;color:var(--muted)}
.tag.with{background:var(--purple-deep);color:#fff}
.tag.with .hmark{width:14px;height:14px;color:#fff}
.tag.today{background:var(--lav);color:var(--purple-deep)}
.cap h1{font-family:var(--f-display);font-weight:700;color:var(--purple-deep);font-size:clamp(30px,3.3vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.cap .anim{animation:rise .8s ease both}

.vis{min-width:0;position:relative}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:center}
.phone-col,.browser-col{transition:opacity .8s ease,filter .8s ease;min-width:0}
.split[data-focus="phone"] .browser-col,.split[data-focus="browser"] .phone-col{opacity:.4;filter:saturate(.5)}
.browser-col{position:relative}

/* ---------- generic agent app ---------- */
.phone{width:280px;height:580px;border-radius:42px;background:#F6F6F7;color:#141414;border:9px solid #1E1B29;box-shadow:0 0 0 1px #2A2740,0 24px 60px rgba(28,28,46,.2);position:relative;overflow:hidden;display:flex;flex-direction:column;margin:0 auto;font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
.p-status{display:flex;justify-content:space-between;align-items:center;padding:11px 22px 2px;font-size:13px;font-weight:600}
.p-head{position:relative;height:72px;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 12px 0;flex:none}
.p-round{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);display:grid;place-items:center}
.p-invite{background:#fff;border-radius:999px;padding:8px 13px;font-weight:600;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.p-ava{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.p-ava .agent-ic{width:50px;height:50px}
.p-ava .nm{margin-top:-9px;background:#fff;border-radius:999px;padding:3px 11px;font-weight:600;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.10);position:relative}
.agent-ic{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#FFF9F0,#ECDFCB 60%,#D3BFA2);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.p-tabs{margin:0 10px 10px;background:#fff;border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(5,1fr);padding:4px;flex:none}
.p-tabs span{height:32px;display:grid;place-items:center;border-radius:18px;color:#141414}
.p-tabs span.on{background:#EDEDF0}
.p-msgs{-webkit-mask-image:linear-gradient(transparent 0,#000 26px);mask-image:linear-gradient(transparent 0,#000 26px)}
.p-msgs{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;padding:10px 12px}
.m{font-size:13.5px;line-height:1.38;padding:10px 13px;border-radius:18px;animation:rise .7s ease both}
.m.me{align-self:flex-end;max-width:84%;background:#141414;color:#fff}
.m.ag{align-self:stretch;background:#EBEBEE}
.m .opt{display:block;border:1px dashed #B5B5BC;border-radius:10px;padding:7px 10px;margin-top:7px;font-size:12.5px;background:#fff}
.m.sys{align-self:center;background:none;padding:2px 0;color:#8A8A90;font-size:11px}
.p-input{margin:0 10px 8px;background:#fff;border-radius:22px;min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;font-size:13.5px;box-shadow:0 2px 12px rgba(0,0,0,.06);flex:none}
.p-input .txt{flex:1;min-width:0;line-height:1.35}
.p-input .txt.ph{color:#9A9AA2}
.p-input .send{width:30px;height:30px;border-radius:50%;background:#141414;color:#fff;display:grid;place-items:center;flex:none}
.caret{display:inline-block;width:1.5px;height:15px;background:#4C7BF4;vertical-align:-2px;animation:blink 1s steps(1) infinite}

/* ---------- merchant browser ---------- */
.browser{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(87,40,222,.12);height:580px;display:flex;flex-direction:column}
.b-chrome{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--lav);color:var(--muted);font-size:12px}
.b-dots{display:flex;gap:6px}.b-dots i{width:10px;height:10px;border-radius:50%;background:#CFC6F2}
.b-url{flex:1;min-width:0;background:#fff;border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:11.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-state{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px}
.b-state .hmark{width:13px;height:13px}
.b-page{flex:1;position:relative;overflow:hidden}
.pg{position:absolute;inset:0;overflow:hidden;animation:fade .7s ease both}
.mh{display:flex;align-items:center;gap:16px;padding:13px 22px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.mh .wm{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.mh .wm i{width:16px;height:16px;border-radius:4px;background:#0F766E;display:inline-block}
.mh .sp{flex:1}
.vbar{display:flex;align-items:center;gap:8px;background:var(--lav);color:var(--purple-deep);font-size:12px;padding:7px 22px;font-weight:500;animation:fade .4s ease both}
.vbar .hmark{width:15px;height:15px}
.vbar .sp{flex:1}
.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:22px}
.art{border-radius:14px;background:#F3F4F6;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.art svg{width:78%}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0F766E;background:#CCFBF1;border-radius:4px;padding:3px 7px;margin-bottom:10px}
.prod h2{font-family:var(--f-display);font-size:25px;line-height:1.1;margin:0 0 4px}
.prod .sub{color:var(--faint);font-size:13px}
.price{font-family:var(--f-display);font-size:24px;font-weight:700;margin:12px 0;font-variant-numeric:tabular-nums}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.sizes span{border:1px solid var(--line);border-radius:8px;text-align:center;padding:7px 0;font-size:12.5px}
.sizes span.sel{border-color:var(--ink);font-weight:600}
.cta{display:block;text-align:center;background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-weight:600;font-size:13.5px}
.cta.dim{opacity:.3}

.cart{padding:24px}
.cart h2{font-family:var(--f-display);font-size:24px;margin:0 0 14px}
.cart .row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}
.cart .row .th{width:64px;height:64px;border-radius:10px;background:#F3F4F6;display:grid;place-items:center}
.cart .row .th svg{width:54px}
.cart .row b{font-size:14.5px}
.cart .row small{display:block;color:var(--faint);font-size:12.5px}
.cart .row .pr{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;margin-top:14px}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.stamp{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-8deg);border:4px solid var(--bad);color:var(--bad);font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:.02em;padding:6px 26px;border-radius:12px;background:rgba(255,255,255,.85);animation:stamp .6s cubic-bezier(.2,1.4,.4,1) .9s both;white-space:nowrap}

.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px 0;gap:8px}
.done .ok{width:52px;height:52px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;margin-bottom:6px}
.done .ok svg{width:24px;height:24px;color:var(--ok)}
.done h2{font-family:var(--f-display);font-size:26px;margin:0}
.done p{margin:0;color:var(--faint);font-size:14px}

/* generic CAPTCHA (made up, not any real vendor's) */
.veil{position:absolute;inset:0;background:rgba(240,240,244,.82);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fade .7s ease .3s both}
.cap-card{width:min(330px,100%);background:#fff;border:1px solid #D9DAE3;border-radius:12px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,.12)}
.cap-card h3{margin:0 0 4px;font-size:17px;font-family:var(--f-display)}
.cap-card p{margin:0 0 14px;font-size:13px;color:var(--faint)}
.slider{position:relative;height:44px;border-radius:8px;background:#EEF0F4;border:1px solid #D9DAE3;overflow:hidden}
.slider .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;color:#7A7F8C}
.slider .knob{position:absolute;left:3px;top:3px;width:52px;height:36px;border-radius:6px;background:#6B7280;color:#fff;display:grid;place-items:center;animation:tryslide 2.2s ease-in-out 1.2s 2 both}
.slider .knob svg{width:16px;height:16px}
.cap-err{margin-top:10px;font-size:12.5px;color:var(--bad);font-weight:600;animation:fade .5s ease 3.6s both}
.stuck{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:11.5px;font-weight:600;color:#3B3B46;background:#F1F1F4;border-radius:999px;padding:4px 10px 4px 5px}
.stuck .agent-ic{width:18px;height:18px}

.hold{position:relative;overflow:hidden;border:2px solid #1A1A1A;border-radius:999px;height:48px;display:grid;place-items:center;font-weight:700;font-size:14px;margin:4px auto 12px;width:240px;max-width:100%;background:#fff}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:#1A1A1A;animation:holdfill 3s cubic-bezier(.4,0,.6,1) 2.6s forwards}
.hold .lbl{position:relative;color:#fff;mix-blend-mode:difference}
@keyframes holdfill{to{width:100%}}
.hcard{width:min(340px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px 16px;text-align:center;box-shadow:0 20px 50px rgba(87,40,222,.14)}
.hcard .hmark{width:34px;height:34px;display:block;margin:0 auto 10px}
.hcard h3{font-family:var(--f-display);font-size:19px;margin:0 0 6px}
.hcard p{font-size:13px;color:var(--faint);margin:0 0 12px;line-height:1.45}
.hold.idle .fill{animation:none}
.hcard .who .agent-ic{width:18px;height:18px}
.hcard .who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--purple-deep);background:var(--lav-2);border-radius:999px;padding:4px 10px;animation:fade .5s ease 2.2s both}
.hcard .by{font-size:10.5px;color:var(--faint);margin-top:10px;font-family:var(--f-mono)}
.veil.light{background:rgba(246,244,255,.82)}
.co{padding:22px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.co h2{font-family:var(--f-display);font-size:22px;margin:0 0 12px}
.co .box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:10px}
.co .box b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.co .sum{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px}
.co .sum div{display:flex;justify-content:space-between;padding:4px 0}
.co .sum .t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.cta.ok-cta{background:var(--ink)}
.steps{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#26243B;font-size:12.5px}
.st.hi{background:#322C5C;outline:1px solid var(--purple)}
.st.past{opacity:.8}
.st .r{display:flex;align-items:center;gap:6px}
.st .tick{color:#7EE7A6;font-weight:700}
.others{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.others span{font-size:11px;color:#B7B2D8;background:#26243B;border-radius:999px;padding:3px 8px}
.seg span.on.amber{background:#D97706}
/* side panels */
.panel{position:absolute;right:-16px;bottom:-20px;width:300px;border-radius:14px;overflow:hidden;animation:panelIn .8s cubic-bezier(.2,.8,.2,1) .6s both;z-index:3;font-size:12.5px}
.panel.light{background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(28,28,46,.16)}
.panel.dark{background:var(--deep);color:#F4F2FF;box-shadow:0 20px 50px rgba(28,28,46,.3)}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line)}
.panel.dark .panel-h{border-color:#2E2B48}
.panel.dark .hmark{color:#fff;width:16px;height:16px}
.panel-b{padding:6px 14px 12px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.panel.dark .prow{border-color:#2E2B48}
.prow:last-child{border-bottom:0}
.prow span:first-child{color:var(--faint)}
.panel.dark .prow span:first-child{color:#9C97C2}
.prow span:last-child{text-align:right;font-weight:600}
.prow .w{color:var(--warn)}.prow .g{color:#7EE7A6}.prow .q{color:#9A9AA2;font-weight:500}
.teams{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.teams span{font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 9px;background:#F1F1F4;color:var(--muted)}
.pol{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.pol .pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:#26243B}
.pol .pr.hi{background:#322C5C;outline:1px solid var(--purple)}
.pol .pr span{font-size:12px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
.chip.allow{background:rgba(34,197,94,.18);color:#86EFAC}
.chip.challenge{background:rgba(245,158,11,.18);color:#FCD34D}
.chip.block{background:rgba(240,72,72,.2);color:#FCA5A5}
.chip.limit{background:rgba(108,71,255,.28);color:#C9BCFF}
.seg{display:flex;gap:3px;margin-top:7px}
.seg span{flex:1;text-align:center;font-size:10.5px;font-weight:600;padding:4px 0;border-radius:6px;background:#1C1C2E;color:#8E89B5}
.seg span.on{background:var(--ok);color:#fff;animation:pick .6s ease 2s both}
.panel-sub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9C97C2;font-weight:600;margin:10px 0 2px}

/* ---------- boards ---------- */
.board{min-height:580px;display:grid;place-items:center;animation:fade .8s ease both}
.switch-card{width:min(460px,100%);background:#fff;border-radius:18px;padding:30px 30px 26px;box-shadow:0 24px 60px rgba(87,40,222,.14);text-align:left}
.switch-card .hlogo{height:22px;width:auto;aspect-ratio:480/111}
.switch-card .t{display:flex;justify-content:space-between;align-items:center;margin:22px 0 6px;gap:16px}
.switch-card h2{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em}
.switch-card .sub{color:var(--faint);font-size:14px;margin:0 0 18px}
.toggle{width:64px;height:36px;border-radius:999px;background:#D7D4E6;position:relative;flex:none;animation:ton .6s ease 1.4s both}
.toggle i{position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:kon .6s ease 1.4s both}
.switch-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.switch-card li{display:flex;gap:10px;align-items:center;font-size:14.5px;animation:rise .4s ease both}
.switch-card li i{width:22px;height:22px;border-radius:50%;background:var(--purple-deep);color:#fff;display:grid;place-items:center;flex:none}
.switch-card li i svg{width:12px;height:12px}

.share{width:100%;max-width:820px}
.hub{width:min(420px,100%);margin:0 auto;background:var(--deep);color:#F4F2FF;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(28,28,46,.25)}
.hub .hmark{width:34px;height:34px;color:#fff}
.hub b{font-family:var(--f-display);font-size:17px;display:block}
.hub span{font-size:13px;color:#B7B2D8}
.wires{display:block;width:100%;height:90px}
.wires path{fill:none;stroke:var(--purple);stroke-width:2;stroke-dasharray:6 7;vector-effect:non-scaling-stroke;animation:flow 1.2s linear infinite}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 12px 30px rgba(87,40,222,.08);animation:rise .7s ease both}
.tile h3{margin:0 0 8px;font-family:var(--f-display);font-size:18px;color:var(--purple-deep)}
.tile p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.tile .k{display:inline-block;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

.end{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.end .hlogo{height:72px;width:auto;aspect-ratio:480/111;color:var(--ink);animation:rise .9s ease both}
.end p{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3vw,40px);color:var(--purple-deep);animation:rise .5s ease .2s both}

/* ---------- timeline + controls ---------- */
.ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tl{flex:1;display:flex;gap:4px;min-width:200px}
.tl button{border:0;padding:6px 0;background:transparent;flex:1}
.tl button i{display:block;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;position:relative}
.tl button i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--purple-deep)}
.tl button.past i b{width:100%}
.tl button.cur i b{animation:fill linear forwards}
.tl.paused button.cur i b{animation-play-state:paused}
.btns{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.btns button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.btns button:hover{background:var(--lav);color:var(--purple-deep)}
.btns button.main{background:var(--purple-deep);color:#fff}
.btns svg{width:16px;height:16px}
.note{font-size:11.5px;color:var(--faint);width:100%;text-align:center}
body.embed .btns,body.embed .note{display:none}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes fill{to{width:100%}}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1.6)}to{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
@keyframes tryslide{0%{left:3px}55%{left:46%}70%{left:46%}100%{left:3px}}
@keyframes ton{to{background:var(--ok)}}
@keyframes kon{to{left:32px}}
@keyframes pick{from{transform:scale(.8);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition:none!important}.tl button.cur i b{animation:none;width:100%}}

@media (max-width:1100px){
  .stage{grid-template-columns:minmax(0,1fr);gap:20px}
  .panel{right:10px;bottom:10px}
}
@media (max-width:760px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split[data-focus="phone"] .browser-col,.split[data-focus="browser"] .phone-col{display:none}
  .browser{height:auto;min-height:500px}
  .b-page{min-height:460px}
  .panel{position:relative;right:auto;bottom:auto;width:100%;margin-top:12px}
  .prod{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .wires{height:50px}
  .board{min-height:auto;padding-block:20px}
  .top small{font-size:13px}
}

  product:o=>`${head()}${o.banner?vbar():''}<div class="prod"><div class="art">${SHOE}</div><div><span class="badge">${o.badge||'New release'}</span><h2>${o.n||'Aero Runner Low'}</h2><div class="sub">Men's running shoe · Teal / Amber</div><div class="price">$${o.pr||140}</div><div class="sizes"><span>8</span><span>9</span><span class="sel">10</span><span>11</span></div><span class="cta${o.dim?' dim':''}">Add to cart</span></div></div>`,

    <div class="steps"><div class="st past"><span>Browse & search</span><span class="r"><span class="tick">✓</span>Allowed</span></div>

    <div class="st hi"><span>Checkout</span><span class="chip challenge">Next · Challenge</span></div></div></div></div>`,
  holding:`<div class="panel dark">${POLHEAD}<div class="panel-b">
    <div class="prow"><span>Visitor</span><span>Muse · AI shopping agent</span></div>
    <div class="prow"><span>Step</span><span>Checkout</span></div>
    <div class="prow"><span>Policy</span><span>Challenge a person</span></div>

  confirmed:`<div class="panel dark">${POLHEAD}<div class="panel-b">
    <div class="steps"><div class="st past"><span>Browse & search</span><span class="r"><span class="tick">✓</span>Agent</span></div>
    <div class="st past"><span>Add to cart</span><span class="r"><span class="tick">✓</span>Agent</span></div>

    <div class="prow" style="margin-top:6px"><span>Outcome</span><span class="g">Order placed · $180</span></div></div></div>`,
  analytics:`<div class="panel light"><div class="panel-h">Your analytics · this session</div><div class="panel-b">
    <div class="prow"><span>Visitor</span><span>Chrome · Windows</span></div>
    <div class="prow"><span>Source</span><span>Direct</span></div>
    <div class="prow"><span>AI agent</span><span class="w">Not detected</span></div>
    <div class="prow"><span>Acting for</span><span class="q">Unknown</span></div>
    <div class="teams"><span>Marketing: a normal visit</span><span>Security: no signal</span></div></div></div>`,
  policy:`<div class="panel dark"><div class="panel-h">${H}HUMAN Sightline</div><div class="panel-b">
    <div class="prow"><span>Visitor</span><span>Muse · AI shopping agent</span></div>
    <div class="prow"><span>Acting for</span><span>A shopper</span></div>
    <div class="prow"><span>Activity</span><span>Product page → cart</span></div>
    <div class="panel-sub">Your agent policy</div>
    <div class="pol"><div class="pr hi"><span>AI shopping agents</span><span class="chip allow">Allow</span></div>
    <div class="seg"><span class="on">Allow</span><span>Challenge</span><span>Block</span><span>Rate-limit</span></div>
    <div class="pr"><span>AI crawlers</span><span class="chip limit">Rate-limit</span></div>
    <div class="pr"><span>Unknown automation</span><span class="chip challenge">Challenge</span></div>
    <div class="pr"><span>Scraper bots</span><span class="chip block">Block</span></div></div></div></div>`,
  allowed:`<div class="panel dark"><div class="panel-h">${H}HUMAN Sightline</div><div class="panel-b">
    <div class="prow"><span>Visitor</span><span>Muse · AI shopping agent</span></div>
    <div class="prow"><span>Decision</span><span class="g">Allowed by your policy</span></div>
    <div class="prow"><span>Friction</span><span>None</span></div>
    <div class="prow"><span>Outcome</span><span>Order placed · $140</span></div></div></div>`,
};

const BOARDS={
  switch:`<div class="switch-card">${LOGO}<div class="t"><h2>Agentic visibility</h2><span class="toggle"><i></i></span></div><p class="sub">HUMAN Sightline</p><ul>
    <li style="animation-delay:2.2s"><i>${CK}</i>See every AI agent on your site</li>
    <li style="animation-delay:2.7s"><i>${CK}</i>Allow, challenge, block or rate-limit each step</li>
    <li style="animation-delay:3.2s"><i>${CK}</i>Share agent activity with every team</li></ul></div>`,
  share:`<div class="share"><div class="hub">${H}<span><b>HUMAN Sightline</b><span>Muse · 2 orders · $320</span></span></div>
    <svg class="wires" viewBox="0 0 600 90" preserveAspectRatio="none" aria-hidden="true"><path d="M300 0V36H100V90"/><path d="M300 0V90"/><path d="M300 36H500V90"/></svg>
    <div class="tiles"><div class="tile" style="animation-delay:1s"><h3>Marketing</h3><p>Both orders are attributed to Muse in analytics.</p><span class="k">Analytics</span></div>
    <div class="tile" style="animation-delay:1.6s"><h3>Ecommerce</h3><p>Muse checked out one order; the shopper finished the limited release.</p><span class="k">Conversion</span></div>
    <div class="tile" style="animation-delay:2.2s"><h3>Security</h3><p>Muse was stopped at checkout on the limited release, exactly as the policy says.</p><span class="k">Policy</span></div></div></div>`,
  end:`<div class="end">${LOGO}</div>`,
};

const W={k:'without',t:'Without agentic visibility'}, WI={k:'with',t:'With HUMAN Sightline'}, TD={k:'today',t:'Agentic commerce'};
const S=[
 {tag:TD, cap:'Your customers are sending AI agents to shop for them.', dur:6500, focus:'phone', msgs:[], typing:ASK, b:{page:'product'}},
 {tag:W, cap:'Treat every agent like a bot, and it hits a wall.', dur:7000, focus:'all', msgs:[me,onit,{f:'ag',t:'Brightwell Supply is asking me to prove I’m human, and I can’t get past it. Can you finish this step yourself?'}], b:{page:'product', dim:true, captcha:true}},
 {tag:W, cap:'Lost sale.', dur:4500, focus:'browser', msgs:[me,onit,{f:'ag',t:'Brightwell Supply is asking me to prove I’m human, and I can’t get past it. Can you finish this step yourself?'},{f:'sys',t:'No reply · task paused'}], b:{page:'cart', url:'brightwellsupply.com/cart'}},
 {tag:W, cap:'Or it walks right in looking like any Chrome user, and every team is flying blind.', dur:8000, focus:'browser', msgs:[me,onit,got], b:{page:'done', url:'brightwellsupply.com/order/confirmed'}, panel:'analytics'},
 {tag:WI, cap:'Turn on agentic visibility with HUMAN Sightline.', dur:5500, board:'switch'},
 {tag:WI, cap:'Know every agent. Choose what gets through.', dur:8000, focus:'browser', msgs:[me,onit], b:{page:'product', prot:true}, panel:'policy'},
 {tag:WI, cap:'Flow, not friction. The sale goes through.', dur:5500, focus:'all', msgs:[me,onit,got], b:{page:'done', url:'brightwellsupply.com/order/confirmed', banner:true, prot:true}, panel:'allowed'},
 {tag:WI, cap:'Then set policies that align to your business.', dur:8000, focus:'all', msgs:[me,onit,got,me2,onit2], b:{page:'product', url:'brightwellsupply.com/aero-runner-gold', prot:true, ...G}, panel:'steps'},
 {tag:WI, cap:'Let it shop...', dur:5000, focus:'browser', msgs:[me,onit,got,me2,onit2,{f:'sys',t:'Added to cart'}], b:{page:'cartok', url:'brightwellsupply.com/cart', prot:true, ...G}, panel:'shopping'},
 {tag:WI, cap:'...but keep checkout for people on limited releases.', dur:8000, focus:'all', msgs:[me,onit,got,me2,onit2,{f:'sys',t:'Added to cart'},{f:'ag',t:'Brightwell Supply doesn’t let agents check out limited releases, so I stopped there. Your cart is saved. Here’s the link to finish checkout.',opts:['brightwellsupply.com/cart']}], b:{page:'checkout', url:'brightwellsupply.com/checkout', prot:true, hold:true, ...G}, panel:'holding'},
 {tag:WI, cap:'Granular controls, aligned to your business policy. The sale still goes through.', dur:6500, focus:'all', msgs:[me,onit,got,me2,onit2,{f:'sys',t:'Added to cart'},{f:'ag',t:'Brightwell Supply doesn’t let agents check out limited releases, so I stopped there. Your cart is saved. Here’s the link to finish checkout.',opts:['brightwellsupply.com/cart']},{f:'sys',t:'You checked out on brightwellsupply.com'}], b:{page:'done', url:'brightwellsupply.com/order/confirmed', banner:'built the cart · checkout completed by the shopper', prot:true, ...G}, panel:'confirmed'},
 {tag:WI, cap:'Every team sees what agents did.', dur:7000, board:'share'},
 {tag:null, cap:'Agentic-ready with HUMAN.', dur:4500, board:'end'},
];

const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let i=0, playing=true, timer=null, typer=null, prevI=-1;

function phoneHTML(s,prev){
  const keep = prev && prev.msgs ? prev.msgs.length : 0;
  const ms=(s.msgs||[]).map((m,k)=>`<div class="m ${m.f}"${k<keep&&prev&&!prev.board?' style="animation:none"':''}>${m.t}${(m.opts||[]).map(o=>`<span class="opt">${o}</span>`).join('')}</div>`).join('');
  return `<div class="p-status"><span>9:41</span><span>●●●</span></div>
   <div class="p-head"><span class="p-round">${ico('<path d="M5 9h14M5 15h14"/>')}</span><span class="p-ava">${AG}<span class="nm">Muse</span></span><span class="p-invite">Invite</span></div>
   <div class="p-msgs">${ms}</div>
   <div class="p-input">${ico('<path d="M12 5v14M5 12h14"/>',20)}<span class="txt ${s.typing?'':'ph'}" id="ptxt">${s.typing?'':'Message'}</span>${ico('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',19)}</div>
   <div class="p-tabs"><span class="on">${ico('<path d="M4 12a8 7 0 1 1 3.4 5.7L4 19l1-3.3A6.8 6.8 0 0 1 4 12z"/>',17)}</span><span>${ico('<rect x="5" y="4" width="14" height="16" rx="2.5"/><path d="M9 9h6M9 13h6"/>',17)}</span><span>${ico('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',17)}</span><span>${ico('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/>',17)}</span><span>${ico('<circle cx="7.5" cy="7.5" r="3.2"/><path d="M16.5 4l3.5 6h-7z"/><rect x="4.3" y="13.8" width="6.4" height="6.4" rx="1.4"/><circle cx="16.5" cy="17" r="3.2"/>',17)}</span></div>`;
}
function render(){
  const s=S[i], prev=prevI>=0?S[prevI]:null; prevI=i;
  const tag=s.tag?`<span class="tag ${s.tag.k}">${s.tag.k==='with'?H:''}${s.tag.t}</span>`:'';
  $('cap').innerHTML=`<div class="anim">${tag}<h1>${s.cap}</h1></div>`;
  if(typer){clearInterval(typer);typer=null}
  if(s.board){
    $('vis').innerHTML=`<div class="board">${BOARDS[s.board]}</div>`;
  }else{
    const b=s.b, url=b.url||URL;
    const state=b.prot?`<span class="b-state">${H}Protected by HUMAN</span>`:`<span class="b-state">No agent visibility</span>`;
    $('vis').innerHTML=`<div class="split" data-focus="${s.focus}"><div class="phone-col"><div class="phone">${phoneHTML(s,prev)}</div></div>
      <div class="browser-col"><div class="browser"><div class="b-chrome"><span class="b-dots"><i></i><i></i><i></i></span><span class="b-url">${url}</span>${state}</div>
      <div class="b-page"><div class="pg">${PAGES[b.page](b)}${b.captcha?CAPTCHA:''}${b.hold?HOLD:''}</div></div></div>${s.panel?PANELS[s.panel]:''}</div></div>`;
    if(s.typing){const el=$('ptxt');
      if(reduce){el.innerHTML=s.typing}
      else{let n=0;typer=setInterval(()=>{n++;el.innerHTML=s.typing.slice(0,n)+'<span class="caret"></span>';if(n>=s.typing.length){clearInterval(typer);typer=null}},Math.min(55,(s.dur-2500)/s.typing.length))}}
  }
  $('tl').innerHTML=S.map((x,k)=>`<button class="${k<i?'past':k===i?'cur':''}" aria-label="Scene ${k+1}" data-k="${k}"><i><b style="animation-duration:${x.dur}ms"></b></i></button>`).join('');
  $('tl').classList.toggle('paused',!playing);
  $('tl').querySelectorAll('button').forEach(bt=>bt.onclick=()=>{pause();go(+bt.dataset.k)});
  schedule();
}
function schedule(){clearTimeout(timer); if(playing) timer=setTimeout(()=>go((i+1)%S.length),S[i].dur)}
function go(k){i=(k+S.length)%S.length; if(i===0) prevI=-1; render()}
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>', PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function setBtn(){$('bPlay').innerHTML=playing?PAUSE:PLAY;$('bPlay').setAttribute('aria-label',playing?'Pause':'Play')}
function pause(){playing=false;clearTimeout(timer);setBtn();$('tl').classList.add('paused')}
function play(){playing=true;setBtn();render()}
$('bPlay').onclick=()=>playing?pause():play();
$('bNext').onclick=()=>{pause();go(i+1)};
$('bPrev').onclick=()=>{pause();go(i-1)};
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){e.preventDefault();pause();go(i+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();pause();go(i-1)}
  else if(e.key===' '){e.preventDefault();playing?pause():play()}
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&playing){clearTimeout(timer)} else if(!document.hidden&&playing){render()} });
if(location.hash==='#embed') document.body.classList.add('embed');
setBtn(); render();
})();
</script>
